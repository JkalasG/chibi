<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC875"/>
      <stop offset="60%" stop-color="#F69B42"/>
      <stop offset="100%" stop-color="#E57C29"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7E5C8"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55C48A"/>
      <stop offset="100%" stop-color="#1E583B"/>
    </linearGradient>
  </defs>
  
    <!-- Sombra -->
    <ellipse cx="400" cy="690" rx="120" ry="20" fill="#D5CDD8" opacity="0.6"/>
    <!-- Cuerpo Bebe Chibi -->
    <path d="M 320 460 C 290 520, 290 620, 330 650 C 370 680, 430 680, 470 650 C 510 620, 510 520, 480 460 Z" fill="url(#fur)" stroke="#4A2518" stroke-width="8"/>
    <!-- Pancita crema -->
    <ellipse cx="400" cy="570" rx="90" ry="80" fill="url(#cream)"/>
    <!-- Cola moviendose con transformacion de fotograma 6 -->
    <g transform="translate(480, 540) rotate(12) translate(-480, -540)">
      <path d="M 460 560 C 500 600, 580 570, 575 500 C 570 440, 510 420, 480 440 C 460 450, 455 490, 480 500 Z" fill="url(#fur)" stroke="#4A2518" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="530" cy="460" rx="22" ry="18" fill="url(#cream)"/>
    </g>
    <!-- Cabeza Bebe -->
    <path d="M 400 280 C 430 280, 490 310, 500 370 C 515 420, 460 470, 400 470 C 340 470, 285 420, 300 370 C 310 310, 370 280, 400 280 Z" fill="url(#fur)" stroke="#4A2518" stroke-width="8"/>
    <!-- Orejas -->
    <path d="M 315 320 C 300 250, 340 220, 375 255 Z" fill="url(#fur)" stroke="#4A2518" stroke-width="8"/>
    <path d="M 485 320 C 500 250, 460 220, 425 255 Z" fill="url(#fur)" stroke="#4A2518" stroke-width="8"/>
    <!-- Carita Kawaii Ojos felices -->
    <ellipse cx="355" cy="370" rx="12" ry="14" fill="#4A2518"/>
    <circle cx="351" cy="365" r="4" fill="#FFF"/>
    <ellipse cx="445" cy="370" rx="12" ry="14" fill="#4A2518"/>
    <circle cx="441" cy="365" r="4" fill="#FFF"/>
    <path d="M 385 390 C 385 385, 415 385, 415 390 C 415 398, 400 402, 400 402 Z" fill="#4A2518"/>
    <path d="M 375 408 Q 400 418 425 408" fill="none" stroke="#4A2518" stroke-width="7" stroke-linecap="round"/>
    
</svg>